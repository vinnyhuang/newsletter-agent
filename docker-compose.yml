# Postgres for this project only.
#
# Configuration comes from .env, which Compose loads automatically from this
# directory — the same file src/config/env.ts validates. One source of truth:
# change POSTGRES_PORT there and both the container and the app follow.
#
# Deliberately isolated from any Postgres already running on the host: separate
# process, data directory, and role. If 5432 is taken locally, set a different
# POSTGRES_PORT in .env; the container always listens on 5432 internally, so
# only the published host port moves.
#
#   pnpm db:up      start it
#   pnpm db:down    stop it (data survives)
#   docker compose down -v   stop it and destroy the data
#
# Langfuse is NOT here — it runs from its own compose outside this repo, with
# its own Postgres/Clickhouse/Redis/MinIO. See docs/langfuse-setup.md.

services:
  postgres:
    image: postgres:17-alpine
    container_name: newsletter-agent-postgres
    restart: unless-stopped
    ports:
      # `:?` fails fast with a readable message if .env is missing, rather than
      # silently binding somewhere unexpected. Bound to loopback only, so the
      # container is never reachable from the network — which is what makes
      # local-only credentials acceptable.
      - '127.0.0.1:${POSTGRES_PORT:?missing — copy .env.example to .env}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?missing — copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing — copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?missing — copy .env.example to .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # `$$` escapes to a single `$` so the variable is resolved by the shell
      # inside the container, from the environment set above — rather than
      # substituted by Compose out here. One less place to keep in step.
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
